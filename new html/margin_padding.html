<html>
	<head>
		<title>margin and padding</title>
		<style>
			#m{
				height:200px;
				width:300px;
				background:red;
				padding:50px;
			}
			#inner{
				height:150px;
				width:200px;
				background:white;
				margin:10px;
			}
			#p{
				height:400;
				width:300;
				border:12px dotted #00f;
				//padding:20px;
				margin:20px;
			}
			#inner1{
				height:200px;
				width:200px;
				border:12px dashed #0ff;
				margin:0px auto;
			}
			
		</style>
	</head>
	<body>
		<div id="m">
			<div id="inner"></div>
		</div>
		<div id="p">
			<div id="inner1"></div>
		</div>
	</body>
</html>
