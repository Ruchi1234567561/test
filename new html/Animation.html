<!doctype html>
<html>
	<head>
		<title>Animation Property</title>
		<style>
			.animate{
				height:200px;
				width:200px;
				background:red;
				margin:100px auto;
				animation-name:up_down;
				transform:scale(.2);
				animation-duration:2s;
				animation-direction:alternate;
				animation-iteration-count:infinite;
			}
			@keyframes up_down{
				0%{
					transform:scale(.8);
					background:red;
				}
				20%{
					transform:scale(.8);
					background:teal;
				}
				50%{
					transform:scale(1);
					background:green;
				}
				75%{
					transform:scale(1.5);
					background:fuchsia;
				}
				100%{
					transform:scale(2);
					background:navy;
				}
			}
		</style>
	</head>
	<body>
		<div class="animate"></div>
	</body>
</html>
