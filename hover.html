<!doctype html>
<html>
	<head>
		<title>Hover class property</title>
		<style>
			.box{
				height:300px;
				width:400px;
				background:fuchsia;
				margin:100px auto;
				transition:all ease 5s;
				border:10px solid navy;
			}
			.box:hover{
				background:green;
				border-radius:50%;
				border:10px solid blue;
			}
			h1{
				background:teal;
				border:2px solid teal;
				transition:all ease 5s;
			}
			h1:hover{
				background:navy;
				color:fuchsia;
				letter-spacing:10px;
				text-transform:uppercase
			}
		</style>
	</head>
	<body>
		<div class="box"></div>
		<h1 align="center">Techsima Solution Private Limited Lucknow</h1>
	</body>
</html>
