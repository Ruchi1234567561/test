<!doctype html>
<html>
	<head>
		<title>Background Gradient Property</title>
		<style>
			.Garima{
				height:300px;
				width:300px;
				background:linear-gradient(45deg, pink, black, green, yellow);
				background:linear-gradient(to right, pink, black, green, yellow);
				background:radial-gradient(pink, black, green, yellow);
				background:conic-gradient(pink, black, green, yellow);
				background:repeating-linear-gradient(yellow 10%, red 20%);
				float:left;
			}
			.Aneesha{
				height:300px;
				width:300px;
				background:linear-gradient(yellow, red, green);
				float:left;
			}
		</style>
	</head>
	<body>
		<div class="Garima"></div>
		<div class="Aneesha"></div>
	</body>
</html>
